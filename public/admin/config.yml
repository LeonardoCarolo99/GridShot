backend:
  name: git-gateway
  branch: main

# Local only: lets you add/edit events at /admin while `npm run cms` is running.
# Ignored on the deployed site, which uses Netlify Identity + Git Gateway.
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Series", name: "series", widget: "string", required: false, hint: "e.g. World Rally Championship" }
      - { label: "Cover image", name: "cover", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Gallery", name: "photos", widget: "list", summary: "{{fields.photo}}", field: { label: "Photo", name: "photo", widget: "image" } }
